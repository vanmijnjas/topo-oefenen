<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f2">
    <title>Topo oefenen | Nederland</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <p class="eyebrow">LEER NEDERLAND KENNEN</p>
        <h1>Topo oefenen</h1>
        <p class="intro">Oefen provincies en steden van Nederland, vraag voor vraag.</p>
      </header>

      <section class="quiz-card" aria-labelledby="question">
        <div class="quiz-toolbar">
          <label for="quiz-mode">Oefenen</label>
          <select id="quiz-mode" disabled>
            <option value="mixed">Alles door elkaar</option>
            <option value="cities">Steden</option>
            <option value="provinces">Provincies en hoofdsteden</option>
          </select>
        </div>

        <div class="score-row" aria-live="polite">
          <span id="question-count">Vraag 0</span>
          <span id="score">0 goed</span>
        </div>

        <div class="question-area">
          <p id="question-type" class="question-type"></p>
          <h2 id="question">De quiz wordt geladen...</h2>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>

        <div id="answers" class="answers" aria-label="Kies je antwoord"></div>
        <button id="next-question" class="next-button" type="button" disabled>
          Volgende vraag <span aria-hidden="true">→</span>
        </button>
      </section>

      <p id="data-status" class="data-status" role="status"></p>
      <footer>
        <span>Jouw oefenstof staat in</span>
        <code>data/plaatsen.json</code>
      </footer>
    </main>
  </body>
</html>
